name: Deploy PowerPulse to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore PowerPulse.sln

      - name: Build
        run: dotnet build PowerPulse.sln --no-restore -c Release

      - name: Test
        run: dotnet test PowerPulse.sln --no-build -c Release --verbosity normal

      - name: Publish
        run: dotnet publish src/PowerPulse.Web/PowerPulse.Web.csproj -c Release -o release --nologo

      - name: Fix Base Path and Asset Fallbacks for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/powerpulse-cs/" />|g' release/wwwroot/index.html || true
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll
          cd release/wwwroot/_framework
          for f in dotnet.*.js; do
            if [[ "$f" != *.native.* && "$f" != *.runtime.* ]]; then
              cp "$f" dotnet.js || true
            fi
          done
          for f in dotnet.native.*.js; do
            cp "$f" dotnet.native.js || true
          done
          for f in dotnet.runtime.*.js; do
            cp "$f" dotnet.runtime.js || true
          done
          for f in dotnet.native.*.wasm; do
            cp "$f" dotnet.native.wasm || true
          done
          for f in blazor.webassembly.*.js; do
            cp "$f" blazor.webassembly.js || true
          done
          cd ../../..

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'release/wwwroot'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
