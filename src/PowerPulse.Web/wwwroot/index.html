<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PowerPulse — Personal Energy Consumption Intelligence Platform</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link href="PowerPulse.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>

    <!-- GitHub Pages Single Page App Redirect Script -->
    <script>
        (function(l) {
            if (l.search[1] === '/' ) {
                var decoded = l.search.slice(1).split('&').map(function(s) { 
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>
</head>

<body>
    <div id="app">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#03050B;color:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1DA058" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
                <span style="font-size:26px;font-weight:700;letter-spacing:-0.5px;">Power<span style="color:#1DA058;">Pulse</span></span>
            </div>
            <div style="font-size:14px;color:#A2B2BB;margin-bottom:16px;">Loading Energy Intelligence Platform...</div>
            <div class="spinner-border text-success" role="status" style="width:2rem;height:2rem;border-color:#1DA058;border-right-color:transparent;">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Bundled Libraries and Interop Scripts -->
    <script src="lib/chart.js"></script>
    <script src="js/indexedDb.js"></script>
    <script src="js/chartInterop.js"></script>
    <script src="js/fileInterop.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
